specVersion: 0.0.4
description: Spectra Subgraph
repository: https://github.com/perspectivefi/spectra-subgraph
schema:
  file: ./schema.graphql
features:
  - nonFatalErrors
dataSources:
  - name: Registry
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: Registry
      address: '{{ registry }}'
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      language: wasm/assemblyscript
      apiVersion: 0.0.6
      entities: [ ]
      file: ./src/mappings/registry.ts
      abis:
        - name: Registry
          file: ./abis/Registry.json
        - name: Factory
          file: ./abis/Factory.json
      eventHandlers:
        - event: FactoryChange(indexed address,indexed address)
          handler: handleFactoryChange
  - name: MetavaultsRegistry
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: MetavaultsRegistry
      address: '{{ metavaultsRegistry }}'
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      language: wasm/assemblyscript
      apiVersion: 0.0.6
      entities: [ ]
      file: ./src/mappings/metavaults/metavaultRegistry.ts
      abis:
        - name: MetavaultsRegistry
          file: ./abis/MetavaultsRegistry.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
      eventHandlers:
        - event: MetavaultRegistered(indexed address)
          handler: handleMetavaultRegistered
        - event: MetavaultUnregistered(indexed address)
          handler: handleMetavaultUnregistered
        - event: ChainRegistered(indexed address,indexed uint256,indexed address)
          handler: handleChainRegistered
        - event: ChainUnregistered(indexed address,indexed uint256,indexed address)
          handler: handleChainUnregistered
        - event: MarketRegistered(indexed address,indexed address)
          handler: handleMarketRegistered
        - event: MarketUnregistered(indexed address,indexed address)
          handler: handleMarketUnregistered
        - event: BridgePathAllowed(indexed address,indexed address,address,indexed uint32,address)
          handler: handleBridgePathAllowed
        - event: BridgePathRemoved(indexed address,indexed address,address,indexed uint32,address)
          handler: handleBridgePathRemoved
  - name: SpectraWrapper
    kind: ethereum/contract
    network: {{network}}
    source:
      abi: Spectra4626Wrapper
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities: [ ]
      file: ./src/mappings/wrappers.ts
      abis:
        - name: Spectra4626Wrapper
          file: ./abis/Spectra4626Wrapper.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
      eventHandlers:
        - event: AuthorityUpdated(address)
          handler: handleAuthorityUpdated
  - name: Metavault
    kind: ethereum/contract
    network: {{network}}
    source:
      abi: MetavaultWrapper
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities: [ ]
      file: ./src/mappings/metavaults/metavaultWrapper.ts
      abis:
        - name: MetavaultWrapper
          file: ./abis/MetavaultWrapper.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
        - name: MetavaultWrapper
          file: ./abis/MetavaultWrapper.json
        - name: AmphorAsyncVault
          file: ./abis/AmphorAsyncVault.json
      eventHandlers:
        - event: MetaVaultWrapperInitialized(indexed address,indexed address,indexed address)
          handler: handleMetaVaultWrapperInitialized
  - name: LimitOrderEngine
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: LimitOrderEngine
      address: '{{ limitOrderEngine }}'
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      language: wasm/assemblyscript
      apiVersion: 0.0.6
      entities: [ ]
      file: ./src/mappings/limitOrders.ts
      abis:
        - name: LimitOrderEngine
          file: ./abis/LimitOrderEngine.json
        - name: NonceManager
          file: ./abis/NonceManager.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
        - name: PrincipalToken
          file: ./abis/PrincipalToken.json
      eventHandlers:
        - event: OrderFilled(bytes32,uint256)
          handler: handleOrderFilled
        - event: OrderCanceled(address,bytes32)
          handler: handleOrderCanceled
        - event: NonceIncreased(indexed address,uint256,uint256)
          handler: handleNonceIncreased
        - event: AuthorityUpdated(address)
          handler: handleAuthorityUpdated
        - event: FeeRecipientUpdated(indexed address)
          handler: handleFeeRecipientUpdated
        - event: RouterUpdated(indexed address)
          handler: handleRouterUpdated
        - event: Paused(address)
          handler: handlePaused
        - event: Unpaused(address)
          handler: handleUnpaused
  - name: AccessManager
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: AccessManager
      address: '{{ accessManager }}'
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      language: wasm/assemblyscript
      apiVersion: 0.0.6
      entities: [ ]
      file: ./src/mappings/accessManager.ts
      abis:
        - name: AccessManager
          file: ./abis/AccessManager.json
      eventHandlers:
        - event: RoleGranted(indexed uint64,indexed address,uint32,uint48,bool)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed uint64,indexed address)
          handler: handleRoleRevoked
        - event: RoleAdminChanged(indexed uint64,indexed uint64)
          handler: handleRoleAdminChanged
        - event: RoleGuardianChanged(indexed uint64,indexed uint64)
          handler: handleRoleGuardianChanged
        - event: RoleGrantDelayChanged(indexed uint64,uint32,uint48)
          handler: handleRoleGrantDelayChanged
        - event: TargetAdminDelayUpdated(indexed address,uint32,uint48)
          handler: handleTargetAdminDelayUpdated
        - event: TargetClosed(indexed address,bool)
          handler: handleTargetClosed
        - event: TargetFunctionRoleUpdated(indexed address,bytes4,indexed uint64)
          handler: handleTargetFunctionRoleUpdated
        - event: OperationScheduled(indexed bytes32,indexed uint32,uint48,address,address,bytes)
          handler: handleOperationScheduled
        - event: OperationExecuted(indexed bytes32,indexed uint32)
          handler: handleOperationExecuted
        - event: OperationCanceled(indexed bytes32,indexed uint32)
          handler: handleOperationCanceled
        - event: RoleLabel(indexed uint64,string)
          handler: handleRoleLabel
  - name: BridgeInterfaceCCTP
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: BridgeInterfaceCCTP
      address: '{{ bridgeCCTP }}'
      startBlock: {{ startBlock }}
    mapping:
      kind: ethereum/events
      language: wasm/assemblyscript
      apiVersion: 0.0.6
      entities: [ ]
      file: ./src/mappings/bridgeInterfaceCCTP.ts
      abis:
        - name: BridgeInterfaceCCTP
          file: ./abis/BridgeInterfaceCCTP.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
      eventHandlers:
        - event: BridgeInitiated(indexed address,indexed address,uint256,indexed uint32,address,string,address)
          handler: handleBridgeInitiated
templates:
  - name: Factory
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: Factory
    mapping:
      kind: ethereum/events
      language: wasm/assemblyscript
      apiVersion: 0.0.6
      entities: [ ]
      file: ./src/mappings/futures.ts
      abis:
        - name: Factory
          file: ./abis/Factory.json
        - name: PrincipalToken
          file: ./abis/PrincipalToken.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
        - name: ERC4626
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC4626.json
        - name: FeedRegistryInterface
          file: ./node_modules/@chainlink/contracts/abi/v0.8/FeedRegistryInterface.json
        - name: CurvePool
          file: ./abis/CurvePoolUnified.json
        - name: CurvePoolNG
          file: ./abis/CurvePoolNG.json
        - name: CurvePoolSNG
          file: ./abis/CurvePoolSNG.json
      eventHandlers:
        - event: PTDeployed(indexed address,indexed address)
          handler: handlePTDeployed
        - event: CurvePoolDeployed(indexed address,indexed address,indexed address)
          handler: handleCurvePoolDeployed
        - event: RegistryChange(indexed address,indexed address)
          handler: handleRegistryChange
        - event: CurveFactoryChange(indexed address,indexed address)
          handler: handleCurveFactoryChange
  - name: ERC20
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: ERC20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities: [ ]
      file: ./src/mappings/transfers.ts
      abis:
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
        - name: ERC4626
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC4626.json
        - name: PrincipalToken
          file: ./abis/PrincipalToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
  - name: IBT
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: ERC4626
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities: [ ]
      file: ./src/mappings/transfers.ts
      abis:
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
        - name: ERC4626
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC4626.json
        - name: PrincipalToken
          file: ./abis/PrincipalToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleIBTTransfer
  - name: PrincipalToken
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: PrincipalToken
    mapping:
      kind: ethereum/events
      language: wasm/assemblyscript
      apiVersion: 0.0.6
      entities: [ ]
      file: ./src/mappings/futures.ts
      abis:
        - name: PrincipalToken
          file: ./abis/PrincipalToken.json
        - name: ERC4626
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC4626.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
      eventHandlers:
        - event: Paused(address)
          handler: handlePaused
        - event: Unpaused(address)
          handler: handleUnpaused
        - event: FeeClaimed(indexed address,indexed uint256,indexed uint256)
          handler: handleFeeClaimed
        - event: YieldClaimed(indexed address,indexed address,indexed uint256)
          handler: handleYieldClaimed
        - event: YieldUpdated(indexed address,indexed uint256)
          handler: handleYieldUpdated
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handlePTTransfer
        - event: Mint(indexed address,indexed address,uint256)
          handler: handleMint
        - event: Redeem(indexed address,indexed address,uint256)
          handler: handleRedeem
  - name: CurvePool
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: CurvePool
    mapping:
      kind: ethereum/events
      language: wasm/assemblyscript
      apiVersion: 0.0.6
      entities: [ ]
      file: ./src/mappings/amm.ts
      abis:
        - name: CurvePool
          file: ./abis/CurvePoolUnified.json
        - name: CurvePoolNG
          file: ./abis/CurvePoolNG.json
        - name: CurvePoolSNG
          file: ./abis/CurvePoolSNG.json
        - name: Factory
          file: ./abis/Factory.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
        - name: ERC4626
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC4626.json
        - name: PrincipalToken
          file: ./abis/PrincipalToken.json
      eventHandlers:
        # AddLiquidity
        - event: AddLiquidity(indexed address,uint256[2],uint256,uint256)
          handler: handleAddLiquidity
        - event: AddLiquidity(indexed address,uint256[2],uint256,uint256,uint256)
          handler: handleAddLiquidityNG
        - event: AddLiquidity(indexed address,uint256[],uint256[],uint256,uint256)
          handler: handleAddLiquiditySNG
        # RemoveLiquidity
        - event: RemoveLiquidity(indexed address,uint256[2],uint256)
          handler: handleRemoveLiquidity
        - event: RemoveLiquidity(indexed address,uint256[],uint256[],uint256)
          handler: handleRemoveLiquiditySNG
        # RemoveLiquidityOne
        - event: RemoveLiquidityOne(indexed address,uint256,uint256,uint256)
          handler: handleRemoveLiquidityOne
        - event: RemoveLiquidityOne(indexed address,uint256,uint256,uint256,uint256,uint256)
          handler: handleRemoveLiquidityOneNG
        - event: RemoveLiquidityOne(indexed address,int128,uint256,uint256,uint256)
          handler: handleRemoveLiquidityOneSNG
        - event: RemoveLiquidityImbalance(indexed address,uint256[],uint256[],uint256,uint256)
          handler: handleRemoveLiquidityImbalanceSNG
        # TokenExchange
        - event: TokenExchange(indexed address,uint256,uint256,uint256,uint256)
          handler: handleTokenExchange
        - event: TokenExchange(indexed address,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleTokenExchangeNG
        - event: TokenExchange(indexed address,int128,uint256,int128,uint256)
          handler: handleTokenExchangeSNG
        # ClaimAdminFee
        - event: ClaimAdminFee(indexed address,uint256)
          handler: handleClaimAdminFee
        - event: ClaimAdminFee(indexed address,uint256[2])
          handler: handleClaimAdminFeeNG
        # NewParameters
        - event: CommitNewParameters(indexed uint256,uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleCommitNewParameters
        - event: NewParameters(uint256,uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleNewParameters
        - event: NewParameters(uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleNewParametersNG
  - name: SpectraWrapper
    kind: ethereum/contract
    network: {{network}}
    source:
      abi: Spectra4626Wrapper
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities: []
      file: ./src/mappings/wrappers.ts
      abis:
        - name: Spectra4626Wrapper
          file: ./abis/Spectra4626Wrapper.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
  - name: NonceManager
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: NonceManager
    mapping:
      kind: ethereum/events
      language: wasm/assemblyscript
      apiVersion: 0.0.6
      entities: [ ]
      file: ./src/mappings/limitOrders.ts
      abis:
        - name: NonceManager
          file: ./abis/NonceManager.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
      eventHandlers:
        - event: NonceIncreased(indexed address,uint256,uint256)
          handler: handleNonceManagerNonceIncreased
  - name: MetavaultWrapper
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: MetavaultWrapper
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities: [ ]
      file: ./src/mappings/metavaults/metavaultWrapper.ts
      abis:
        - name: ERC4626
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC4626.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
        - name: MetavaultWrapper
          file: ./abis/MetavaultWrapper.json
        - name: AmphorAsyncVault
          file: ./abis/AmphorAsyncVault.json
      eventHandlers:
        - event: DepositRequest(indexed address,indexed address,indexed uint256,address,uint256)
          handler: handleDepositRequest
        - event: DecreaseDepositRequest(indexed uint256,indexed address,indexed uint256,uint256)
          handler: handleDecreaseDepositRequest
        - event: RedeemRequest(indexed address,indexed address,indexed uint256,address,uint256)
          handler: handleRedeemRequest
        - event: DecreaseRedeemRequest(indexed uint256,indexed address,indexed uint256,uint256)
          handler: handleDecreaseRedeemRequest
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
  - name: AmphorAsyncVault
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: AmphorAsyncVault
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities: [ ]
      file: ./src/mappings/metavaults/amphorAsyncVault.ts
      abis:
        - name: ERC4626
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC4626.json
        - name: ERC20
          file: ./node_modules/@openzeppelin/contracts/build/contracts/ERC20.json
        - name: MetavaultWrapper
          file: ./abis/MetavaultWrapper.json
        - name: AmphorAsyncVault
          file: ./abis/AmphorAsyncVault.json
      eventHandlers:
        - event: EpochStart(indexed uint256,uint256,uint256)
          handler: handleEpochStart
  - name: GnosisSafe
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: GnosisSAFE
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities: [ ]
      file: ./src/mappings/metavaults/modules.ts
      abis:
        - name: GnosisSAFE
          file: ./abis/GnosisSAFE.json
      eventHandlers:
        - event: EnabledModule(indexed address)
          handler: handleEnabledModule
        - event: EnabledModule(address)
          handler: handleEnabledModule
        - event: SafeModuleTransaction(address,address,uint256,bytes,uint8)
          handler: handleSafeModuleTransaction
        - event: SafeMultiSigTransaction(address,uint256,bytes,uint8,uint256,uint256,uint256,address,address,bytes,bytes)
          handler: handleSafeMultiSigTransaction
  - name: GnosisSafeModule
    kind: ethereum/contract
    network: {{ network }}
    source:
      abi: GnosisSAFEModule
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities: [ ]
      file: ./src/mappings/metavaults/modules.ts
      abis:
        - name: GnosisSAFEModule
          file: ./abis/GnosisSAFEModule.json
      eventHandlers:
        - event: TransactionAdded(indexed uint256,indexed bytes32,address,uint256,bytes,uint8)
          handler: handleTransactionAdded

