version: "3"
services:
  graph-node:
    image: graphprotocol/graph-node:latest
    ports:
      - "8000:8000"   # GraphQL HTTP (queries)
      - "8001:8001"   # GraphQL WS
      - "8020:8020"   # admin / deploy
      - "8030:8030"   # subgraph health
      - "8040:8040"   # prometheus metrics
    depends_on:
      - ipfs
      - graph-postgres
    extra_hosts:
      # Lets graph-node reach anvil running on the docker host.
      - "host.docker.internal:host-gateway"
    environment:
      postgres_host: graph-postgres
      postgres_user: graph
      postgres_pass: graph
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      # network-name : rpc-url[:capabilities]   — comma-separated for multiple chains
      # capability flags (archive,traces) usually NOT needed for event indexing.
      ethereum: "base:archive,traces:http://host.docker.internal:8545"
      GRAPH_LOG: info
      ETHEREUM_REORG_THRESHOLD: 1
      ETHEREUM_ANCESTOR_COUNT: 1
  ipfs:
    image: ipfs/kubo:v0.27.0
    ports:
      - "5001:5001"
  graph-postgres:
    image: postgres:16
    ports:
      - "5434:5432"   # 5434 to avoid colliding with your spectra-pg on 5433
    command:
      - "postgres"
      - "-cshared_preload_libraries=pg_stat_statements"
    environment:
      POSTGRES_USER: graph
      POSTGRES_PASSWORD: graph
      POSTGRES_DB: graph-node
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - graph-data:/var/lib/postgresql/data

volumes:
  graph-data:
