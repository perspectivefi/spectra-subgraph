name: Registry addresses

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: registry-addresses-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry-addresses:
    name: check configs against @perspectivefi/addresses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --ignore-scripts

      - name: Check config addresses against the registry
        run: yarn check:registry
